seed: 42
device: cuda:0
num_steps_per_env: 32
max_iterations: 3000
empirical_normalization: null
obs_groups:
  policy:
  - policy
  - policy_history
  critic:
  - policy
  - policy_history
  - critic_privileged
  - dynamics_privileged
  - terrain_privileged
clip_actions: null
save_interval: 50
experiment_name: go2_asymppo_ablations
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
policy:
  class_name: TemporalBlindActorCritic
  init_noise_std: 0.35
  noise_std_type: scalar
  state_dependent_std: false
  actor_obs_normalization: false
  critic_obs_normalization: false
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  actor_init_path: null
  history_group_name: policy_history
  temporal_channels:
  - 64
  - 64
  temporal_kernel_size: 3
  history_feature_dim: 64
  history_target_dim: 128
  history_target_hidden_dims:
  - 128
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.002
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
num_envs: null
